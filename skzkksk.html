<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Font Maker</title>
    <!-- 引入 opentype.js -->
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    <style>
        body { background: #1e1e1e; color: #fff; font-family: monospace; text-align: center; padding: 20px; user-select: none; }
        canvas { background: #fff; border: 2px solid #555; border-radius: 4px; margin-top: 20px; touch-action: none; cursor: crosshair; }
        .controls { margin-top: 20px; display: flex; gap: 15px; justify-content: center; align-items: center; flex-wrap: wrap; }
        input { background: #333; color: #0f0; border: 1px solid #0f0; padding: 10px; width: 50px; text-align: center; font-size: 20px; text-transform: uppercase; }
        button { padding: 10px 20px; font-size: 16px; background: #0f0; color: #000; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; }
        button:hover { background: #0a0; }
        button.danger { background: #f00; color: #fff; }
        button.export { background: #ff0; color: #000; }
        .info { color: #888; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>[ PIXEL FONT MAKER v1.0 ]</h2>
    <div class="info">直接在格子上点击（或滑动）即可画字</div>
    
    <canvas id="gridCanvas" width="300" height="300"></canvas>

    <div class="controls">
        <label>当前字符: <input type="text" id="charInput" value="A" maxlength="1"></label>
        <button onclick="saveChar()">保存当前字符</button>
        <button class="danger" onclick="clearGrid()">清空画板</button>
        <button class="export" onclick="exportFont()">⚡ 导出 TTF 字体</button>
    </div>

    <script>
        const canvas = document.getElementById('gridCanvas');
        const ctx = canvas.getContext('2d');
        
        // 定义网格：15x15 (适合画英文字母，想做中文可以改成 24x24)
        const gridSize = 15; 
        const cellSize = canvas.width / gridSize;
        
        // 初始化网格数据（0 表示空，1 表示有像素）
        let gridData = Array(gridSize).fill().map(() => Array(gridSize).fill(0));
        
        // 存放已保存的字符
        let savedChars = {}; 

        // 绘制网格
        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    // 填充颜色
                    ctx.fillStyle = gridData[y][x] ? '#000' : '#fff';
                    ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
                    
                    // 画辅助线
                    ctx.strokeStyle = '#eee';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x * cellSize, y * cellSize, cellSize, cellSize);
                }
            }
        }

        // 鼠标/触摸滑动绘制
        let isDrawing = false;
        let drawMode = 1; // 1是画，0是擦除

        function handlePointer(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            
            // 兼容鼠标和触摸
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const x = Math.floor((clientX - rect.left) / cellSize);
            const y = Math.floor((clientY - rect.top) / cellSize);

            if (x >= 0 && x < gridSize && y >= 0 && y < gridSize) {
                gridData[y][x] = drawMode;
                drawGrid();
            }
        }

        // 绑定事件
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / cellSize);
            const y = Math.floor((e.clientY - rect.top) / cellSize);
            // 判断当前点的是亮的还是暗的，决定接下来是画还是擦
            if (x >= 0 && x < gridSize && y >= 0 && y < gridSize) {
                drawMode = gridData[y][x] ? 0 : 1;
            }
            handlePointer(e);
        });

        canvas.addEventListener('mousemove', handlePointer);
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseleave', () => isDrawing = false);

        // 触摸屏支持
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isDrawing = true;
            handlePointer(e);
        }, {passive: false});
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handlePointer(e);
        }, {passive: false});
        canvas.addEventListener('touchend', () => isDrawing = false);

        // 清空画板
        function clearGrid() {
            gridData = Array(gridSize).fill().map(() => Array(gridSize).fill(0));
            drawGrid();
        }

        // 保存当前字符
        function saveChar() {
            const char = document.getElementById('charInput').value.toUpperCase();
            if (!char) return alert("请输入要保存的字符！");
            
            savedChars[char] = JSON.parse(JSON.stringify(gridData)); // 深拷贝
            alert(`字符 "${char}" 已保存！`);
            
            // 自动跳到下一个字符（方便连续画画）
            if (char < 'Z') {
                document.getElementById('charInput').value = String.fromCharCode(char.charCodeAt(0) + 1);
            }
            clearGrid();
        }

        // 🚀 终极核心：导出字体
        function exportFont() {
            if (Object.keys(savedChars).length === 0) {
                return alert("你还没有保存任何字符！");
            }

            // 字体基础参数
            const unitsPerEm = 1000; 
            const ascender = 800;
            const descender = -200;
            
            // 缩放比例：网格是 15x15，映射到 1000 的字体单位
            // 假设我们留一点边距，每个格子占 60 单位
            const unitSize = 60; 
            const offsetX = 100; // 左边距
            const offsetY = 100; // 底边距

            const glyphs = [];

            // 1. 添加必需的 .notdef 字形（空）
            glyphs.push(new opentype.Glyph({
                name: '.notdef',
                unicode: 0,
                advanceWidth: gridSize * unitSize + offsetX * 2,
                path: new opentype.Path()
            }));

            // 2. 遍历保存的字符，把像素块转成方块轮廓
            for (const char in savedChars) {
                const unicode = char.charCodeAt(0);
                const data = savedChars[char];
                const glyphPath = new opentype.Path();

                for (let y = 0; y < gridSize; y++) {
                    for (let x = 0; x < gridSize; x++) {
                        if (data[y][x] === 1) {
                            // 计算这个格子在字体坐标系里的位置
                            // 注意：Canvas的Y轴是向下的，字体Y轴是向上的
                            const fontX = offsetX + x * unitSize;
                            const fontY = offsetY + (gridSize - 1 - y) * unitSize;

                            // 画一个正方形封闭路径
                            glyphPath.moveTo(fontX, fontY);
                            glyphPath.lineTo(fontX + unitSize, fontY);
                            glyphPath.lineTo(fontX + unitSize, fontY + unitSize);
                            glyphPath.lineTo(fontX, fontY + unitSize);
                            glyphPath.close();
                        }
                    }
                }

                // 组装单个字形
                const glyph = new opentype.Glyph({
                    name: char,
                    unicode: unicode,
                    advanceWidth: gridSize * unitSize + offsetX * 2, // 字宽
                    path: glyphPath
                });
                glyphs.push(glyph);
            }

            // 3. 生成并下载字体文件
            const font = new opentype.Font({
                familyName: 'MyPixelFont',
                styleName: 'Regular',
                unitsPerEm: unitsPerEm,
                ascender: ascender,
                descender: descender,
                glyphs: glyphs
            });

            font.download();
            alert("字体生成成功！快去下载里看看 .ttf 文件。");
        }

        // 初始化画布
        drawGrid();
    </script>
</body>
</html>
