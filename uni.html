<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto Font Pipeline</title>
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    <style>
        body { background: #121212; color: #fff; font-family: monospace; padding: 20px; display: flex; flex-direction: column; align-items: center; margin: 0; }
        h2 { margin: 10px 0; font-weight: 300; letter-spacing: 2px; color: #0f0; }
        
        .top-bar { display: flex; gap: 20px; margin-bottom: 20px; background: #222; padding: 15px 30px; border-radius: 8px; border: 1px solid #333; align-items: center; flex-wrap: wrap; justify-content: center;}
        .top-bar input[type="text"] { background: #000; color: #0f0; border: 1px solid #0f0; padding: 8px; border-radius: 4px; outline: none; font-family: monospace; width: 150px;}
        .top-bar input[type="range"] { vertical-align: middle; }
        
        .canvas-container { position: relative; background: #fff; border-radius: 8px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 0 20px rgba(0,255,0,0.2); }
        canvas { display: block; touch-action: none; cursor: crosshair; }
        
        .guide { position: absolute; left: 0; width: 100%; pointer-events: none; border-top: 1px solid rgba(0,0,0,0.1); }
        .guide.baseline { bottom: 50px; border-top: 1px dashed #f00; } 
        .guide.ascender { bottom: 250px; border-top: 1px dashed #00f; } 

        .status-bar { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; background: #000; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #0f0; box-sizing: border-box;}
        .char-info { font-size: 28px; color: #0f0; font-weight: bold; }
        .hex-info { font-size: 14px; color: #888; }

        button { background: #0f0; color: #000; border: none; padding: 12px 25px; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: monospace; margin: 0 10px; transition: 0.2s;}
        button:hover { background: #fff; box-shadow: 0 0 15px #fff;}
        button.danger { background: #f00; color: #fff; }
        button.export { background: #ff0; }

        .nav-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .nav-bar button { padding: 8px 16px; font-size: 14px; background: #333; color: #0f0; border: 1px solid #0f0; }
        .nav-bar button:hover { background: #0f0; color: #000; }
    </style>
</head>
<body>

    <h2>[ AUTO FONT PIPELINE ]</h2>

    <div class="top-bar">
        <label>字体名称: <input type="text" id="fontName" value="MyAutoFont"></label>
        <label>笔刷粗细: <input type="range" id="brushSize" min="2" max="30" value="8"> <span id="brushSizeVal">8</span>px</label>
    </div>

    <!-- 字符显示区 -->
    <div class="status-bar">
        <div>
            <div class="char-info" id="displayChar">[ 空白 ]</div>
            <div class="hex-info" id="displayHex">U+0020 (已保存: 0字)</div>
        </div>
    </div>

    <!-- 字符导航 -->
    <div class="nav-bar">
        <button onclick="prevChar()">◀ 上一个</button>
        <button onclick="nextChar()">下一个 ▶</button>
        <button onclick="jumpToChar()">跳转字符</button>
    </div>

    <div class="canvas-container">
        <canvas id="fontCanvas" width="400" height="400"></canvas>
        <div class="guide ascender"></div>
        <div class="guide baseline"></div>
    </div>

    <div>
        <button onclick="saveAndNext()">保存并切下一个</button>
        <button class="danger" onclick="clearCanvas()">清空画板</button>
        <button class="export" onclick="exportFont()">⚡ 导出 OTF</button>
    </div>

    <script>
        const canvas = document.getElementById('fontCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let currentPath = []; 
        let allPaths = [];    
    
        let savedCharacters = {}; 
        let currentUnicode = 0x0020; // 默认从 0020（空格）开始

        const brushSizeInput = document.getElementById('brushSize');
        const brushSizeVal = document.getElementById('brushSizeVal');

        // 防止页面滚动/缩放干扰绘图
        canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
        canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

        function updateDisplay() {
            const hexStr = currentUnicode.toString(16).toUpperCase().padStart(4, '0');
            let charStr = String.fromCodePoint(currentUnicode);
            
            if (currentUnicode === 32) charStr = "[ 空格 ]";
            else if (currentUnicode < 32 || (currentUnicode >= 127 && currentUnicode <= 160)) charStr = "[ 控制符 ]";

            document.getElementById('displayChar').innerText = charStr;
            document.getElementById('displayHex').innerText = `U+${hexStr} (已保存: ${Object.keys(savedCharacters).length}字)`;
        }

        brushSizeInput.addEventListener('input', (e) => {
            brushSizeVal.innerText = e.target.value;
        });

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            // 考虑 canvas 可能被 CSS 缩放
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return { 
                x: (clientX - rect.left) * scaleX, 
                y: (clientY - rect.top) * scaleY 
            };
        }

        function startDraw(e) {
            if (e.touches && e.touches.length !== 1) return; // 多指触摸忽略
            e.preventDefault();
            isDrawing = true;
            currentPath = [getPos(e)];
        }

        function draw(e) {
            if (!isDrawing) return;
            if (e.touches && e.touches.length !== 1) return;
            e.preventDefault();
            const pos = getPos(e);
            currentPath.push(pos);
            
            // 实时预览：直接描线
            ctx.beginPath();
            ctx.moveTo(currentPath[currentPath.length - 2].x, currentPath[currentPath.length - 2].y);
            ctx.lineTo(pos.x, pos.y);
            ctx.lineWidth = brushSizeInput.value;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#000';
            ctx.stroke();
        }

        function stopDraw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            isDrawing = false;
            if (currentPath.length > 1) {
                allPaths.push({ points: currentPath.slice(), width: parseFloat(brushSizeInput.value) });
            }
            currentPath = [];
        }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('mouseout', stopDraw);
        canvas.addEventListener('touchstart', startDraw, {passive: false});
        canvas.addEventListener('touchmove', draw, {passive: false});
        canvas.addEventListener('touchend', stopDraw, {passive: false});
        canvas.addEventListener('touchcancel', stopDraw, {passive: false});

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            allPaths = [];
            // 若当前字符已保存，清空画板不应删除已保存数据，只是重新绘制
            if (savedCharacters[currentUnicode]) {
                // 重新绘制已保存的路径
                savedCharacters[currentUnicode].forEach(pathObj => {
                    const points = pathObj.points;
                    ctx.beginPath();
                    ctx.moveTo(points[0].x, points[0].y);
                    for (let i = 1; i < points.length; i++) {
                        ctx.lineTo(points[i].x, points[i].y);
                    }
                    ctx.lineWidth = pathObj.width;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.strokeStyle = '#000';
                    ctx.stroke();
                });
                allPaths = JSON.parse(JSON.stringify(savedCharacters[currentUnicode]));
            }
        }

        function saveCurrent() {
            if (allPaths.length > 0) {
                savedCharacters[currentUnicode] = JSON.parse(JSON.stringify(allPaths));
            } else {
                // 如果清空了所有路径，则删除该字符的保存
                delete savedCharacters[currentUnicode];
            }
        }

        function saveAndNext() {
            saveCurrent();
            currentUnicode++;
            if (currentUnicode > 0x9FFF) {
                currentUnicode = 0x9FFF;
                alert("恭喜通关！你已经画到了 CJK 区最后一个字 9FFF！");
            }
            clearCanvasAndLoad(currentUnicode);
            updateDisplay();
        }

        function prevChar() {
            saveCurrent();
            currentUnicode--;
            if (currentUnicode < 0) currentUnicode = 0;
            clearCanvasAndLoad(currentUnicode);
            updateDisplay();
        }

        function nextChar() {
            saveCurrent();
            currentUnicode++;
            if (currentUnicode > 0x9FFF) {
                currentUnicode = 0x9FFF;
                alert("已经是最后一个字符了！");
            }
            clearCanvasAndLoad(currentUnicode);
            updateDisplay();
        }

        function jumpToChar() {
            const input = prompt("请输入字符或 Unicode 码位（如：A 或 U+0041 或 65）:");
            if (!input) return;
            
            let targetUnicode = null;
            const trimmed = input.trim();
            
            if (trimmed.startsWith('U+') || trimmed.startsWith('u+')) {
                targetUnicode = parseInt(trimmed.substring(2), 16);
            } else if (trimmed.length === 1) {
                targetUnicode = trimmed.codePointAt(0);
            } else if (/^\d+$/.test(trimmed)) {
                targetUnicode = parseInt(trimmed, 10);
            }
            
            if (targetUnicode === null || isNaN(targetUnicode) || targetUnicode < 0 || targetUnicode > 0x10FFFF) {
                alert("无效的字符或码位！");
                return;
            }
            
            saveCurrent();
            currentUnicode = targetUnicode;
            clearCanvasAndLoad(currentUnicode);
            updateDisplay();
        }

        function clearCanvasAndLoad(unicode) {
            // 清空画板
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            allPaths = [];
            
            // 如果该字符已保存，加载并绘制
            if (savedCharacters[unicode]) {
                allPaths = JSON.parse(JSON.stringify(savedCharacters[unicode]));
                allPaths.forEach(pathObj => {
                    const points = pathObj.points;
                    if (points.length < 2) return;
                    ctx.beginPath();
                    ctx.moveTo(points[0].x, points[0].y);
                    for (let i = 1; i < points.length; i++) {
                        ctx.lineTo(points[i].x, points[i].y);
                    }
                    ctx.lineWidth = pathObj.width;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.strokeStyle = '#000';
                    ctx.stroke();
                });
            }
        }

        // 🚀 将线变空心轮廓，导出 OTF
        function exportFont() {
            saveCurrent(); // 保存当前正在画的字
            
            const keys = Object.keys(savedCharacters);
            if (keys.length === 0) return alert("你还没有保存任何字符！");

            const familyName = document.getElementById('fontName').value || 'MyAutoFont';
            const unitsPerEm = 1000;
            const descender = -200;
            const scale = unitsPerEm / 400; 
            // 把画布的笔刷粗细映射到字体的单位
            const brushScale = 1.5;

            const glyphs = [
                new opentype.Glyph({ name: '.notdef', unicode: 0, advanceWidth: 600, path: new opentype.Path() })
            ];

            keys.forEach(unicodeStr => {
                const unicode = parseInt(unicodeStr);
                const pathsData = savedCharacters[unicode];
                const glyphPath = new opentype.Path();

                pathsData.forEach(pathObj => {
                    const points = pathObj.points;
                    const brushW = parseFloat(pathObj.width) * brushScale;
                    if (points.length < 2) return;

                    // 沿着轨迹撒下小方块（外圈 + 内圈挖空）
                    for (let i = 1; i < points.length; i++) {
                        const p1 = points[i-1];
                        const p2 = points[i];
                        
                        const dx = p2.x - p1.x;
                        const dy = p2.y - p1.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        
                        const steps = Math.max(1, Math.floor(dist / (brushW / 2.5)));
                        
                        for (let s = 0; s < steps; s++) {
                            const t = s / steps;
                            const cx = p1.x + dx * t;
                            const cy = p1.y + dy * t;
                            
                            // 坐标转换到字体空间 (Y轴反转)
                            const fx = cx * scale;
                            const fy = (canvas.height - cy) * scale + descender;
                            
                            const half = brushW / 2;
                            const innerHalf = half * 0.5; 

                            // 外圈方块（顺时针）
                            glyphPath.moveTo(fx - half, fy - half);
                            glyphPath.lineTo(fx + half, fy - half);
                            glyphPath.lineTo(fx + half, fy + half);
                            glyphPath.lineTo(fx - half, fy + half);
                            glyphPath.close();
                            
                            // 内圈方块（逆时针，用于挖空）
                            glyphPath.moveTo(fx - innerHalf, fy - innerHalf);
                            glyphPath.lineTo(fx - innerHalf, fy + innerHalf);
                            glyphPath.lineTo(fx + innerHalf, fy + innerHalf);
                            glyphPath.lineTo(fx + innerHalf, fy - innerHalf);
                            glyphPath.close();
                        }
                    }
                });

                const glyph = new opentype.Glyph({
                    name: String.fromCodePoint(unicode),
                    unicode: unicode,
                    advanceWidth: 800,
                    path: glyphPath
                });
                glyphs.push(glyph);
            });

            const font = new opentype.Font({
                familyName: familyName,
                styleName: 'Regular',
                unitsPerEm: unitsPerEm,
                ascender: 800, 
                descender: descender, 
                glyphs: glyphs
            });

            // 改为导出 OTF 格式
            font.download({ filename: familyName + '.otf' });
        }

        // 初始化
        updateDisplay();
    </script>
</body>
</html>
