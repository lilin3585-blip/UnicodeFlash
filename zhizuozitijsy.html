<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>赛博字体工厂 - DOM极速版</title>
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@latest/dist/opentype.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: #121212; color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 10px; height: 100vh; overflow: hidden; }
        
        .app-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 10px; height: 100%; }
        
        .control-group { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
        input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: white; font-size: 16px; }
        
        .page-controls { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
        .page-controls button { padding: 10px 15px; background: #007AFF; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; }
        .page-info { font-family: monospace; font-size: 14px; color: #aaa; }

        /* 🌟 DOM 面板：用 Grid 排列，内部滚动，不侵占画板 */
        .char-panel { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 8px; 
            background: #1e1e1e; padding: 10px; border-radius: 8px; border: 1px solid #333;
            flex: 1; /* 占据剩余空间 */
            overflow-y: auto; 
            align-content: start;
        }
        
        .char-btn { 
            padding: 8px 2px; background: #333; color: white; border: 2px solid #444; border-radius: 6px; 
            cursor: pointer; text-align: center; font-size: 20px; transition: 0.1s; user-select: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 70px; /* 固定高度，防止挤在一起 */
        }
        .char-btn.active { background: #007AFF; border-color: #007AFF; }
        .char-btn.done { background: #34C759; border-color: #34C759; color: black; }
        .char-btn .hex { font-size: 10px; opacity: 0.6; margin-top: 4px; font-family: monospace; }

        /* 画板区域 */
        .canvas-wrapper { width: 100%; display: flex; justify-content: center; flex-shrink: 0; }
        .svg-board { 
            background-color: white; border: 2px solid #444; border-radius: 8px;
            width: 100%; max-width: 400px; aspect-ratio: 1/1; /* 稍微缩小画板，给面板留空间 */
            touch-action: none; 
            position: relative;
        }

        .drawn-stroke { 
            fill: none; stroke: #000; stroke-width: 12; 
            stroke-linecap: round; stroke-linejoin: round;
            pointer-events: auto; cursor: pointer;
        }
        .drawn-stroke:hover { stroke: #FF3B30; }

        /* 底部操作区 */
        .actions { display: flex; gap: 10px; width: 100%; flex-shrink: 0; }
        button.action { padding: 12px; font-size: 16px; border: none; border-radius: 8px; font-weight: bold; flex: 1; cursor: pointer; transition: 0.2s; }
        .btn-save { background-color: #FF9500; color: black; }
        .btn-export { background-color: #FF3B30; color: white; }
        #status { color: #00ff00; font-size: 14px; text-align: center; min-height: 20px; flex-shrink: 0; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="control-group">
        <input type="text" id="fontName" placeholder="输入字体名称" value="MyCyberFont_Part1">
        
        <div class="page-controls">
            <button onclick="changePage(-1)">⬅️ 上一页</button>
            <div class="page-info" id="pageInfo">范围: 0000 - 00FF</div>
            <button onclick="changePage(1)">下一页 ➡️</button>
        </div>
    </div>

    <!-- 纯 DOM 面板 -->
    <div class="char-panel" id="charList"></div>

    <div class="canvas-wrapper">
        <svg id="svgBoard" class="svg-board" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
            <path d="M 500 0 L 500 1000 M 0 500 L 1000 500 M 250 0 L 250 1000 M 750 0 L 750 1000 M 0 250 L 1000 250 M 0 750 L 1000 750" stroke="#eee" stroke-width="2" pointer-events="none"/>
            <path d="M 0 0 L 1000 0 L 1000 1000 L 0 1000 Z" fill="none" stroke="#ccc" stroke-width="4" pointer-events="none"/>
        </svg>
    </div>
    
    <div class="actions">
        <button class="action btn-save" onclick="saveCurrentChar()">💾 保存</button>
        <button class="action btn-export" onclick="exportFullFont()">🚀 导出 OTF</button>
    </div>
    <div id="status">准备就绪。点击画错的线条可以删除。</div>
</div>

<script>
    // 🚀 DOM 节点缓存，避免频繁查询
    const svgBoard = document.getElementById('svgBoard');
    const charList = document.getElementById('charList');

    let isDrawing = false;
    let targetChars = []; 
    let currentCharIndex = 0; 
    let glyphDatabase = {}; // { "4E00": [ "M 100 200 L...", ... ] }
    let currentPathString = ""; 
    let currentPathEl = null;

    // 分页配置
    const PAGE_SIZE = 256; 
    let currentPage = 0;   
    const MAX_CODE = 0x3347F; 

    // 🚀 DOM 优化：使用 DocumentFragment 批量插入
    function renderCharList() {
        charList.innerHTML = ''; // 清空当前 DOM
        const fragment = document.createDocumentFragment();

        targetChars.forEach((item, index) => {
            const btn = document.createElement('div');
            btn.className = 'char-btn';
            if (glyphDatabase[item.hex] && glyphDatabase[item.hex].length > 0) btn.classList.add('done');
            if (index === currentCharIndex) btn.classList.add('active');
            
            // 使用 textContent 和 span 组合，避免 innerHTML 解析开销
            const charSpan = document.createElement('span');
            charSpan.textContent = item.char;
            
            const hexSpan = document.createElement('span');
            hexSpan.className = 'hex';
            hexSpan.textContent = item.hex;

            btn.appendChild(charSpan);
            btn.appendChild(hexSpan);
            
            // 绑定事件
            btn.onclick = () => {
                currentCharIndex = index;
                loadCharToCanvas(item.hex);
                // 只更新高亮状态，不全量重绘
                const allBtns = charList.querySelectorAll('.char-btn');
                allBtns.forEach((b, i) => {
                    if (i === index) b.classList.add('active');
                    else b.classList.remove('active');
                });
            };
            fragment.appendChild(btn);
        });

        charList.appendChild(fragment); // 一次 DOM 操作搞定
    }

    function loadPage(pageIndex) {
        currentPage = pageIndex;
        const startCode = currentPage * PAGE_SIZE;
        const endCode = Math.min(startCode + PAGE_SIZE - 1, MAX_CODE);
        
        if (startCode > MAX_CODE) return;

        const hexStart = startCode.toString(16).toUpperCase().padStart(4, '0');
        const hexEnd = endCode.toString(16).toUpperCase().padStart(4, '0');
        document.getElementById('pageInfo').innerText = `范围: ${hexStart} - ${hexEnd}`;

        targetChars = [];
        for (let code = startCode; code <= endCode; code++) {
            const hex = code.toString(16).toUpperCase().padStart(4, '0');
            let char = "";
            try { char = String.fromCodePoint(code); } catch(e) { char = "?"; }
            targetChars.push({ char: char, hex: hex });
        }

        currentCharIndex = 0;
        renderCharList();
        loadCharToCanvas(targetChars[0].hex);
    }

    function changePage(direction) {
        const nextPage = currentPage + direction;
        if (nextPage >= 0 && (nextPage * PAGE_SIZE) <= MAX_CODE) {
            loadPage(nextPage);
        }
    }

    function clearSVG() {
        // 只移除带有 drawn-stroke 类的节点，保留背景网格
        const strokes = svgBoard.querySelectorAll('.drawn-stroke');
        strokes.forEach(s => s.remove());
    }

    function loadCharToCanvas(hex) {
        clearSVG();
        const paths = glyphDatabase[hex];
        if (paths && paths.length > 0) {
            paths.forEach(pathData => {
                createSVGPath(pathData);
            });
            document.getElementById('status').innerText = `已加载 U+${hex}。`;
        } else {
            document.getElementById('status').innerText = `正在绘制 U+${hex}。`;
        }
    }

    function createSVGPath(pathData) {
        const pathEl = document.createElementNS("http://www.w3.org/2000/svg", "path");
        pathEl.setAttribute("d", pathData);
        pathEl.setAttribute("class", "drawn-stroke");
        
        pathEl.onclick = (e) => {
            e.stopPropagation(); 
            pathEl.remove(); // DOM 删除极快
            updateCurrentCharData(); 
        };
        svgBoard.appendChild(pathEl);
        return pathEl;
    }

    function updateCurrentCharData() {
        if (targetChars.length === 0) return;
        const hex = targetChars[currentCharIndex].hex;
        const paths = Array.from(svgBoard.querySelectorAll('.drawn-stroke')).map(p => p.getAttribute('d'));
        glyphDatabase[hex] = paths;
        
        // 更新按钮状态（变绿）
        const btns = charList.querySelectorAll('.char-btn');
        if (btns[currentCharIndex]) {
            if (paths.length > 0) btns[currentCharIndex].classList.add('done');
            else btns[currentCharIndex].classList.remove('done');
        }
    }

    function getPos(e) {
        const rect = svgBoard.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { 
            x: ((clientX - rect.left) / rect.width) * 1000, 
            y: ((clientY - rect.top) / rect.height) * 1000 
        };
    }

    function startDrawing(e) {
        if (targetChars.length === 0) return;
        e.preventDefault(); 
        isDrawing = true; 
        
        const pos = getPos(e);
        currentPathString = `M ${pos.x.toFixed(1)} ${pos.y.toFixed(1)}`;
        currentPathEl = createSVGPath(currentPathString);
    }

    function draw(e) {
        if (!isDrawing || !currentPathEl) return; 
        e.preventDefault();
        
        const pos = getPos(e);
        currentPathString += ` L ${pos.x.toFixed(1)} ${pos.y.toFixed(1)}`;
        // 优化：直接设置 d 属性
        currentPathEl.setAttribute("d", currentPathString);
    }

    function stopDrawing(e) {
        if (!isDrawing) return; 
        e.preventDefault(); 
        isDrawing = false;
        
        if (currentPathString.length > 5 && targetChars.length > 0) {
            const hex = targetChars[currentCharIndex].hex;
            if (!glyphDatabase[hex]) glyphDatabase[hex] = [];
            glyphDatabase[hex].push(currentPathString);
            updateCurrentCharData();
        }
        currentPathString = "";
        currentPathEl = null;
    }

    // 绑定事件 (Passive: false 防止页面跟着滚动)
    svgBoard.addEventListener('mousedown', startDrawing); 
    svgBoard.addEventListener('mousemove', draw); 
    svgBoard.addEventListener('mouseup', stopDrawing);
    svgBoard.addEventListener('mouseleave', stopDrawing); 
    
    svgBoard.addEventListener('touchstart', startDrawing, {passive: false}); 
    svgBoard.addEventListener('touchmove', draw, {passive: false}); 
    svgBoard.addEventListener('touchend', stopDrawing, {passive: false});

    function saveCurrentChar() {
        if (targetChars.length === 0) return;
        updateCurrentCharData();
        document.getElementById('status').innerText = `U+${targetChars[currentCharIndex].hex} 已保存！`;
    }

    function exportFullFont() {
        const customName = document.getElementById('fontName').value || "MyCustomFont";
        let hasData = false;
        
        const notdefGlyph = new opentype.Glyph({ name: '.notdef', unicode: 0, advanceWidth: 1000, path: new opentype.Path() });
        let glyphs = [notdefGlyph];

        // 为了性能，只导出当前页画过的字
        targetChars.forEach(item => {
            const hex = item.hex;
            const unicodeVal = parseInt(hex, 16);
            const paths = glyphDatabase[hex];
            
            let combinedPathData = "";
            if (paths && paths.length > 0) {
                hasData = true;
                combinedPathData = paths.join(" ");
            } else {
                combinedPathData = "M 0 0"; 
            }

            const glyph = new opentype.Glyph({
                name: `char_${hex}`,
                unicode: unicodeVal,
                advanceWidth: 1000, 
                path: new opentype.Path(combinedPathData) 
            });
            glyphs.push(glyph);
        });

        if (!hasData) return alert("你当前页一个字都没画呢！");

        document.getElementById('status').innerText = "正在编译 OTF...";

        const font = new opentype.Font({
            familyName: customName, styleName: 'Regular', unitsPerEm: 1000, ascender: 800, descender: -200, glyphs: glyphs
        });

        const buffer = font.toArrayBuffer();
        const blob = new Blob([buffer], {type: "application/octet-stream"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = `${customName}_Page${currentPage}.otf`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        
        document.getElementById('status').innerText = `🎉 第 ${currentPage} 页导出成功！`;
    }

    // 初始化
    loadPage(0);
</script>
</body>
</html>
